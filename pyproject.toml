[project]
name = "roadsim"
version = "0.1.0"
description = "2D sandbox for road geometry, editor tooling and traffic rules"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.scripts]
road-sim = "roadsim.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadsim"]
